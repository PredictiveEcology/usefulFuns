## Thin caller -- the matrix, system dependencies, caching, Drive staging
## and the check itself all live in PredictiveEcology/actions. This file only
## says which package to check and what it needs on top of the org defaults.
##
## No concurrency block here: the reusable workflow has one, and its
## cancel-in-progress is scoped to pull requests so a push to a default
## branch still runs to completion.

name: R-CMD-check

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

jobs:
  R-CMD-check:
    ## Preserved from this repo's own workflow.
    if: "!contains(github.event.commits[0].message, '[skip-ci]')"
    uses: PredictiveEcology/actions/.github/workflows/R-CMD-check.yaml@main
    with:
      ## post-install calls remotes::install_github; the reusable
      ## workflow does not install remotes for us.
      extra-packages: |
        any::remotes
      post-install: |
        remotes::install_github('traversc/stringfish')
        remotes::install_github('PredictiveEcology/Require@development')
        remotes::install_github('PredictiveEcology/reproducible@development')
